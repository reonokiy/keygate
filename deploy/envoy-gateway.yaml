# Templates for Envoy Gateway with OIDC forwardIDToken and Backend support.
# Validate against the installed CRDs before deployment.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: keygate-proxy, namespace: keygate}
spec:
  credentialInjection:
    header: X-Keygate-Proxy-Secret
    overwrite: true
    credential:
      valueRef: {name: keygate-proxy}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: keygate-manager, namespace: keygate}
spec:
  parentRefs:
    - {name: REPLACE_GATEWAY, namespace: envoy-gateway-system}
  hostnames: [keys.example.com]
  rules:
    - backendRefs:
        - {name: keygate-manager, port: 8080}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: keygate-proxy
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: keygate-login, namespace: keygate}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: keygate-manager}
  oidc:
    provider: {issuer: "https://id.example.com"}
    clientID: REPLACE_CLIENT_ID
    clientSecret: {name: keygate-oidc}
    redirectURL: https://keys.example.com/oauth2/callback
    logoutPath: /logout
    scopes: [openid, profile]
    forwardIDToken: {header: X-Keygate-ID-Token}
---
# Resolve the Service DNS name to its ClusterIP so Kubernetes can enforce
# internalTrafficPolicy: Local. A normal Service backendRef may use Pod IPs
# directly and bypass this policy. Backend CRD must be enabled in Envoy Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata: {name: keygate-authz-local, namespace: keygate}
spec:
  endpoints:
    - fqdn:
        hostname: keygate-authz.keygate.svc.cluster.local
        port: 8081
---
# Example protected HTTPRoute must exist in this namespace; adjust name below.
# The administrator binds this route to the UUID in keygate.json / keygate-config,
# never to a client header. Configure allowed methods, paths and custom API rules
# on the protected HTTPRoute and its gateway policies. Keygate checks the key's
# application membership; it does not interpret those gateway rules.
# Creating/revoking keys afterwards requires no YAML changes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: keygate-api-auth, namespace: keygate}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: protected-api}
  extAuth:
    failOpen: false
    headersToExtAuth: [Authorization]
    http:
      path: /check/11111111-1111-4111-8111-111111111111
      backendRefs:
        - {group: gateway.envoyproxy.io, kind: Backend, name: keygate-authz-local, port: 8081}
      headersToBackend: [x-auth-request-user, x-keygate-user-id, x-keygate-app, x-keygate-key-id]
