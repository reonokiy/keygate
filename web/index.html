<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keygate</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><span class="mark">K</span><div><h1>Keygate</h1><p>共享应用与我的 API key</p></div><span id="identity"></span></header>
<section class="intro"><h2>管理我的 API key</h2><p>应用由所有已登录用户共享。你只能查看和管理自己生成的 API key。</p></section>
<form id="create-app"><label for="app-name">新共享应用</label><div class="row"><input id="app-name" name="name" maxlength="128" required placeholder="例如：Codex API"><button>创建共享应用</button></div></form>
<p id="status" role="status" aria-live="polite"></p><section id="apps" aria-label="应用列表"></section>
<dialog id="key-dialog"><h2>密钥已生成</h2><p>请立即保存。关闭后无法再次查看。</p><textarea id="new-key" readonly aria-label="新密钥" rows="4"></textarea><div class="row"><button id="copy-key">复制密钥</button><button id="close-key" class="secondary">已保存，关闭</button></div></dialog>
<footer>撤销通常在 30 秒内生效，具体取决于管理员设置的缓存时间。</footer></main></body></html>
